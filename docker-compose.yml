services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck -l /data
    volumes:
      - azurite-data:/data
    networks:
      - coffeenchill-net
    restart: unless-stopped

  functions:
    image: mananjalo0106/coffeenchill-functions:v2.0
    container_name: coffeenchill-functions
    depends_on:
      - azurite
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
    networks:
      - coffeenchill-net
    restart: unless-stopped

  api:
    image: mananjalo0106/coffeenchill-api:v3.0
    container_name: coffeenchill-api
    depends_on:
      - azurite
    ports:
      - "5000:8080"
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "CoffeeNChill"
      Jwt__Audience: "CoffeeNChillClients"
      ASPNETCORE_ENVIRONMENT: "Development"
    networks:
      - coffeenchill-net
    restart: unless-stopped

networks:
  coffeenchill-net:
    driver: bridge

volumes:
  azurite-data: